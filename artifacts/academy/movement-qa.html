<!doctype html><html lang="id"><meta charset="utf-8"><title>Academy · actual runtime movement QA</title><style>body{font:15px system-ui;background:#fff8f3;color:#1f1a17;margin:20px}button{padding:12px}iframe{width:100%;height:720px;border:2px solid #1f1a17}pre{white-space:pre-wrap}</style><h1>Academy runtime input QA</h1><p>Fixture akun lokal. Kontrol berikut mengirim keyboard events ke game yang berjalan dalam iframe, tanpa mengganti movement engine.</p><button id="run" disabled>Jalankan movement dan collision</button><pre id="result">Memuat game…</pre><iframe id="game" src="/qa/at/question_hall"></iframe><script type="module">
const frame=document.querySelector('#game'),button=document.querySelector('#run'),result=document.querySelector('#result');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function canvasReady(){for(let i=0;i<200;i++){const doc=frame.contentDocument;const canvas=doc?.querySelector('.academy-canvas');if(canvas&&!doc.querySelector('.academy-state-screen'))return canvas;await sleep(50);}throw Error('Runtime not ready');}
const read=canvas=>({x:Number(canvas.dataset.playerX),y:Number(canvas.dataset.playerY)});
async function hold(canvas,key,ms){const view=frame.contentWindow;canvas.dispatchEvent(new view.PointerEvent('pointerdown',{bubbles:true}));canvas.dispatchEvent(new view.KeyboardEvent('keydown',{key,bubbles:true}));await sleep(ms);canvas.dispatchEvent(new view.KeyboardEvent('keyup',{key,bubbles:true}));await sleep(150);return read(canvas);}
const canvas=await canvasReady();button.disabled=false;result.textContent='Game siap diuji';
button.onclick=async()=>{button.disabled=true;try{const start=read(canvas);const wall=await hold(canvas,'w',3000);const south=await hold(canvas,'s',500);const results={start,afterNorth:wall,afterSouth:south,blockedByExistingHallCollider:wall.x===1296&&wall.y>=554&&wall.y<=556,southMovement: south.y-wall.y>70&&south.y-wall.y<110};results.passed=results.blockedByExistingHallCollider&&results.southMovement;result.textContent=JSON.stringify(results,null,2);result.dataset.done='true';}catch(error){result.textContent=error.message;result.dataset.done='error';}};
</script></html>
